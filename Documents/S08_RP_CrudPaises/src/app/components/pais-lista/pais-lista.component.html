<div class="container">
  <h1>Gestión de Países (CRUD)</h1>

  <div class="layout">
    <!-- ===== COLUMNA IZQUIERDA: Formulario ===== -->
    <div class="card formulario-card">
      <div class="card-header">
        {{ editando ? 'Editar País' : 'Registrar Nuevo País' }}
      </div>
      <div class="card-body">
        <form (ngSubmit)="guardarPais()">
          <div class="form-group">
            <label>Nombre del País:</label>
            <input type="text" class="form-control" [(ngModel)]="paisForm.nombre" name="nombre" required>
          </div>

          <div class="form-group">
            <label>Capital:</label>
            <input type="text" class="form-control" [(ngModel)]="paisForm.capital" name="capital" required>
          </div>

          <div class="form-group">
            <label>Región:</label>
            <input type="text" class="form-control" [(ngModel)]="paisForm.region" name="region" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              {{ editando ? 'Guardar Cambios' : 'Registrar' }}
            </button>
            <button type="button" class="btn btn-secondary" *ngIf="editando" (click)="resetFormulario()">
              Cancelar
            </button>
          </div>
        </form>
      </div>
      <div class="card-footer">
        Controles de texto, números o selectores según los campos.
      </div>
    </div>

    <!-- ===== COLUMNA DERECHA: Listado ===== -->
    <div class="card listado-card">
      <div class="card-header">
        Listado & Acciones Directas
      </div>
      <div class="card-body">
        <table class="table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>NOMBRE</th>
              <th>CAPITAL</th>
              <th>REGIÓN</th>
              <th class="text-end col-acciones">ACCIONES</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let pais of paises">
              <td class="col-id">{{ pais.id }}</td>
              <td>{{ pais.nombre }}</td>
              <td>{{ pais.capital }}</td>
              <td>{{ pais.region }}</td>
              <td class="text-end col-acciones">
                <button class="btn btn-warning btn-sm me-2" (click)="seleccionarParaEditar(pais)">
                  Editar
                </button>
                <button class="btn btn-danger btn-sm" (click)="eliminarPais(pais.id)">
                  Eliminar
                </button>
              </td>
            </tr>
            <tr *ngIf="paises.length === 0">
              <td colspan="5" class="text-center">No hay países registrados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
