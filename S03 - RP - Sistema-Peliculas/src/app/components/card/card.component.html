<div class="card">
  <!-- Imagen del póster -->
  <div class="card-image">
    <img 
      [src]="pelicula.imagen || 'https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg'" 
      [alt]="pelicula.titulo"
      class="poster"
      (error)="onImageError()"
    />
    <div class="card-overlay">
      <span class="card-icon">🎬</span>
    </div>
  </div>

  <!-- Contenido -->
  <div class="card-content">
    <h3 class="card-title">{{ pelicula.titulo }}</h3>
    <p class="card-director">🎭 {{ pelicula.director }}</p>
    <div class="card-info">
      <span class="card-year">📅 {{ pelicula.anio }}</span>
      <span class="card-genre">🎭 {{ pelicula.genero }}</span>
    </div>
    <div class="card-rating">
      <span class="stars">{{ getEstrellas(pelicula.calificacion) }}</span>
      <span class="score">{{ pelicula.calificacion }}/10</span>
    </div>
  </div>

  <!-- Acciones -->
  <div class="card-actions">
    <button class="btn-edit" (click)="onEditar()">✏️ Editar</button>
    <button class="btn-delete" (click)="onEliminar()">🗑️ Eliminar</button>
  </div>
</div>
